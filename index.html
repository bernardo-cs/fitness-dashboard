<!DOCTYPE html>
<html lang="en" data-theme="notion">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='7.1' width='14' height='1.8' rx='.9' fill='%232383E2' opacity='.5'/%3E%3Crect x='3.2' y='4' width='2.4' height='8' rx='1.1' fill='%232383E2'/%3E%3Crect x='10.4' y='4' width='2.4' height='8' rx='1.1' fill='%232383E2'/%3E%3C/svg%3E" />
<title>Bernardo · Training</title>
<style>
  :root, [data-theme="notion"] {
    --sb-bg: #F7F7F5;
    --sb-border: #ECECEA;
    --sb-text: #5F5E5B;
    --sb-active-bg: #ECECEA;
    --sb-hover: #EFEFED;
    --sb-active-text: #37352F;
    --bg: #FFFFFF;
    --card: #FFFFFF;
    --text: #37352F;
    --muted: #787671;
    --border: #E9E9E7;
    --hover: #F4F4F2;
    --accent: #2383E2;
    --good: #1F8A5B;
    --warn: #B97C24;
    --bad: #C4554D;
  }
  [data-theme="plum"] {
    --sb-bg: #3B2240;
    --sb-border: #4D3252;
    --sb-text: #CDBBD1;
    --sb-active-bg: rgba(255, 255, 255, 0.16);
    --sb-hover: rgba(255, 255, 255, 0.08);
    --sb-active-text: #FFFFFF;
    --bg: #FBFAFB;
    --card: #FFFFFF;
    --text: #1D1C1D;
    --muted: #6E6772;
    --border: #E9E4EA;
    --hover: #F4F0F4;
    --accent: #82358C;
    --good: #2BA770;
    --warn: #B97C24;
    --bad: #C4554D;
  }
  [data-theme="graphite"] {
    --sb-bg: #20242E;
    --sb-border: #2C3140;
    --sb-text: #9AA3B2;
    --sb-active-bg: rgba(255, 255, 255, 0.12);
    --sb-hover: rgba(255, 255, 255, 0.06);
    --sb-active-text: #FFFFFF;
    --bg: #F7F8FA;
    --card: #FFFFFF;
    --text: #1E232B;
    --muted: #677081;
    --border: #E4E7EC;
    --hover: #F0F2F5;
    --accent: #2E9E6B;
    --good: #2E9E6B;
    --warn: #B97C24;
    --bad: #C4554D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; font-size: 15px;
  }
  #root { height: 100%; }
  button { font-family: inherit; }

  .app { display: flex; height: 100vh; }
  .sidebar {
    width: 236px; flex-shrink: 0; background: var(--sb-bg);
    border-right: 1px solid var(--sb-border);
    display: flex; flex-direction: column; gap: 2px; padding: 14px 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 7px; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .brand-name { font-weight: 700; font-size: 14px; color: var(--sb-active-text); line-height: 1.2; }
  .brand-sub { font-size: 11.5px; color: var(--sb-text); }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 10px; border-radius: 6px; border: none; background: transparent;
    color: var(--sb-text); font-size: 14px; cursor: pointer; text-align: left;
  }
  .nav-item:hover { background: var(--sb-hover); }
  .nav-item.active { background: var(--sb-active-bg); color: var(--sb-active-text); font-weight: 600; }
  .nav-label-sm { display: none; }
  .sidebar-foot { margin-top: auto; padding: 10px; font-size: 11.5px; color: var(--sb-text); display: flex; flex-direction: column; gap: 8px; }
  .lock-btn {
    border: 1px solid var(--sb-border); background: transparent; color: var(--sb-text);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; width: fit-content;
  }
  .lock-btn:hover { background: var(--sb-hover); color: var(--sb-active-text); }

  .content { flex: 1; overflow-y: auto; }
  .page { max-width: 1000px; margin: 0 auto; padding: 40px 48px 90px; }
  .page-title { font-size: 26px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .page-meta { color: var(--muted); font-size: 13px; margin: 0 0 30px; }
  .section { margin-top: 36px; }
  .section-title {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 12px;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .stat-label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-value { font-size: 22px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; background: var(--hover); color: var(--muted);
    max-width: 100%; line-height: 1.6;
  }
  table.data .chip { white-space: nowrap; } /* status pills in the strength table stay one-line; content chips elsewhere wrap */
  .chip.accent { background: color-mix(in oklab, var(--accent) 11%, transparent); color: var(--accent); }
  .chip.good   { background: color-mix(in oklab, var(--good) 12%, transparent);   color: var(--good); }
  .chip.warn   { background: color-mix(in oklab, var(--warn) 13%, transparent);   color: var(--warn); }
  .chip.bad    { background: color-mix(in oklab, var(--bad) 12%, transparent);    color: var(--bad); }

  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th {
    text-align: left; font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  table.data td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.data tr.clickable { cursor: pointer; }
  table.data tr.clickable:hover { background: var(--hover); }
  .num { font-variant-numeric: tabular-nums; }
  .lift-name { font-weight: 600; }
  .cell-muted { color: var(--muted); font-size: 13px; }
  .dash { color: var(--border); }

  .list-row {
    display: flex; align-items: baseline; gap: 14px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); cursor: default;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row.clickable { cursor: pointer; }
  .list-row.clickable:hover { background: var(--hover); }
  .list-date { width: 84px; flex-shrink: 0; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .list-note { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .list-lift   { width: 170px; flex-shrink: 0; }
  .list-weight { width: 90px; flex-shrink: 0; font-weight: 600; }
  .list-sev    { width: 110px; flex-shrink: 0; }
  .list-main   { flex: 1; min-width: 0; }

  .fresh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .fresh-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .fresh-name { font-weight: 600; font-size: 13.5px; }
  .fresh-meta { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }

  .callout {
    display: flex; gap: 12px; align-items: flex-start;
    background: color-mix(in oklab, var(--warn) 7%, var(--card));
    border: 1px solid color-mix(in oklab, var(--warn) 25%, var(--border));
    border-radius: 8px; padding: 13px 16px; font-size: 13.5px; line-height: 1.5;
  }
  .callout .callout-title { font-weight: 600; margin-bottom: 2px; }
  .callout .callout-body { color: var(--muted); }

  .chronic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; }
  .chronic-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .chronic-area { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chronic-type { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chronic-warmup { margin-top: 10px; font-size: 13px; line-height: 1.5; }
  .chronic-warmup b { font-weight: 600; }
  .chronic-notes { margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  .scrim { position: fixed; inset: 0; background: rgba(20, 18, 22, 0.28); z-index: 39; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw);
    background: var(--card); border-left: 1px solid var(--border); z-index: 40;
    box-shadow: -12px 0 40px rgba(20, 18, 22, 0.10);
    display: flex; flex-direction: column;
  }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
  }
  .drawer-title { font-size: 18px; font-weight: 700; }
  .drawer-close {
    border: none; background: transparent; color: var(--muted); font-size: 18px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1;
  }
  .drawer-close:hover { background: var(--hover); color: var(--text); }
  .drawer-body { padding: 18px 22px 40px; overflow-y: auto; }
  .drawer-section { margin-bottom: 26px; }
  .pct-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .pct-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; overflow-wrap: break-word; }
  .pct-table tr:last-child td { border-bottom: none; }
  .pct-table .pct { color: var(--muted); width: 70px; }
  .pct-table .kg { font-weight: 600; }
  .sets-th {
    text-align: left; font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  .today-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .today-grid > * { min-width: 0; }
  @media (max-width: 860px) { .today-grid { grid-template-columns: 1fr; } }
  .today-note { color: var(--muted); font-size: 13px; font-style: italic; margin-top: 26px; }
  .link-btn {
    margin-top: 14px; border: none; background: transparent; color: var(--accent);
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 0;
  }
  .link-btn:hover { text-decoration: underline; }

  .lock { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .lock-card {
    width: 350px; max-width: calc(100vw - 36px);
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 34px 30px 28px; box-shadow: 0 14px 40px rgba(20, 18, 22, 0.07); text-align: center;
  }
  .lock-mark {
    width: 44px; height: 44px; border-radius: 10px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  }
  .lock-title { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .lock-sub { font-size: 13px; color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  .lock-input {
    width: 100%; padding: 9px 12px; border-radius: 7px; border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text); outline: none;
  }
  .lock-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent); }
  .lock-submit {
    width: 100%; margin-top: 10px; padding: 9px 12px; border-radius: 7px; border: none;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .lock-submit:hover { filter: brightness(1.06); }
  .lock-error { color: var(--bad); font-size: 12.5px; margin-top: 10px; }
  .lock-hint { color: var(--muted); font-size: 11.5px; margin-top: 16px; }
  .lock-remember {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    margin-top: 14px; font-size: 12.5px; color: var(--muted); cursor: pointer;
  }

  /* Settings panel (theme + strength display options) */
  .settings-fab {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    width: 38px; height: 38px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 6px 24px rgba(20, 18, 22, 0.12);
  }
  .settings-fab:hover { color: var(--text); background: var(--hover); }
  .settings-panel {
    position: fixed; right: 18px; bottom: 64px; z-index: 50; width: 264px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 14px 40px rgba(20, 18, 22, 0.14); padding: 14px 16px 16px;
  }
  .settings-row { margin-top: 12px; }
  .settings-row:first-child { margin-top: 0; }
  .settings-label { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .settings-label .val { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--text); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button {
    flex: 1; border: none; background: transparent; color: var(--muted);
    font-size: 12.5px; padding: 6px 4px; cursor: pointer; border-left: 1px solid var(--border);
  }
  .seg button:first-child { border-left: none; }
  .seg button:hover { background: var(--hover); }
  .seg button.active { background: color-mix(in oklab, var(--accent) 11%, transparent); color: var(--accent); font-weight: 600; }
  .settings-slider { width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
  .settings-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
  .settings-toggle input { accent-color: var(--accent); }
  .settings-lock {
    width: 100%; border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 7px; padding: 7px 10px; font-size: 12.5px; cursor: pointer;
  }
  .settings-lock:hover { background: var(--hover); }

  @media (max-width: 760px) {
    .app { flex-direction: column; height: auto; min-height: 100dvh; }

    /* Bottom tab bar — same .sidebar markup, repositioned */
    .sidebar {
      position: fixed; left: 0; right: 0; bottom: 0; width: 100%; z-index: 30;
      flex-direction: row; align-items: stretch; gap: 0;
      padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      border-right: none; border-top: 1px solid var(--sb-border);
    }
    .brand, .sidebar-foot { display: none; }
    .nav-item {
      flex: 1 1 0; flex-direction: column; justify-content: center; gap: 3px;
      padding: 6px 2px; font-size: 10.5px; text-align: center; border-radius: 8px;
    }
    .nav-item svg { width: 20px; height: 20px; }
    .nav-label { display: none; }
    .nav-label-sm { display: block; }

    /* Settings FAB + panel float above the tab bar */
    .settings-fab { bottom: calc(62px + env(safe-area-inset-bottom)); right: 14px; }
    .settings-panel { bottom: calc(108px + env(safe-area-inset-bottom)); right: 14px; max-width: calc(100vw - 28px); }

    .page { padding: 22px 16px calc(86px + env(safe-area-inset-bottom)); }
    .page-title { font-size: 22px; }
    .page-meta { margin-bottom: 22px; }
    .section { margin-top: 28px; }

    /* Strength table -> stacked lift cards.
       Grid areas are coupled to strengthView's column order in app/views.js:
       1 Lift · 2 Best · 3 Est.1RM · 4 Last tested · 5 Trend · 6 Flags */
    table.data, table.data tbody { display: block; }
    table.data thead { display: none; }
    table.data tr {
      display: grid;
      grid-template-columns: minmax(0, max-content) minmax(0, max-content) minmax(0, 1fr);
      grid-template-areas:
        "name   name   spark"
        "best   est    spark"
        "tested tested flags";
      column-gap: 14px; row-gap: 5px; align-items: center;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    table.data tr:last-child { border-bottom: none; }
    table.data td { display: block; padding: 0; border: none; }
    table.data td:nth-child(1) { grid-area: name; font-size: 15px; }
    table.data td:nth-child(2) { grid-area: best; }
    table.data td:nth-child(3) { grid-area: est; }
    table.data td:nth-child(3)::before { content: "e1RM "; color: var(--muted); font-size: 11px; }
    table.data td:nth-child(4) { grid-area: tested; }
    table.data td:nth-child(5) { grid-area: spark; justify-self: end; }
    table.data td:nth-child(6) { grid-area: flags; justify-self: end; }
    table.data td:has(> .dash) { display: none; }

    /* List rows (Recent PRs, drawer history, body log) -> two-line stacking */
    .list-row { flex-wrap: wrap; column-gap: 10px; row-gap: 3px; }
    .list-date, .list-lift, .list-weight, .list-sev { width: auto; flex-shrink: 1; min-width: 0; }
    .list-weight { margin-left: auto; }
    .list-note, .list-main { flex-basis: 100%; }
    .list-note {
      white-space: normal; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Drawer: tighter padding = wider chart */
    .drawer-head { padding: 16px 16px 12px; }
    .drawer-body { padding: 16px 16px calc(30px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="app/main.js"></script>
</body>
</html>
